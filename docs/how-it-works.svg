<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="330" rx="14" fill="#0f172a"/>

  <text x="32" y="42" fill="#f8fafc" font-size="18" font-weight="600">What happens when a mouse button bounces</text>

  <!-- ===== Lane 1: raw signal ===== -->
  <text x="32" y="90" fill="#94a3b8" font-size="13">Your worn-out mouse sends</text>

  <!-- block time window -->
  <rect x="300" y="100" width="120" height="60" fill="#f59e0b" fill-opacity="0.14"/>
  <line x1="420" y1="100" x2="420" y2="160" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="360" y="95" fill="#fbbf24" font-size="12" text-anchor="middle">block time</text>

  <rect x="170" y="110" width="130" height="40" fill="#22c55e" fill-opacity="0.22"/>
  <rect x="318" y="110" width="16" height="40" fill="#ef4444" fill-opacity="0.45"/>
  <rect x="560" y="110" width="130" height="40" fill="#22c55e" fill-opacity="0.22"/>
  <path d="M32 150 H170 V110 H300 V150 H318 V110 H334 V150 H560 V110 H690 V150 H768"
        fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linejoin="round"/>

  <text x="225" y="178" fill="#86efac" font-size="12" text-anchor="middle">your click</text>
  <text x="316" y="178" fill="#fca5a5" font-size="12" text-anchor="start">ghost click, 18 ms later</text>
  <text x="625" y="178" fill="#86efac" font-size="12" text-anchor="middle">your next click</text>

  <!-- ===== Lane 2: filtered ===== -->
  <text x="32" y="222" fill="#94a3b8" font-size="13">What Windows receives with EasyButtonFix</text>

  <rect x="170" y="240" width="130" height="40" fill="#22c55e" fill-opacity="0.22"/>
  <rect x="560" y="240" width="130" height="40" fill="#22c55e" fill-opacity="0.22"/>
  <rect x="318" y="240" width="16" height="40" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M320 244 L332 276 M332 244 L320 276" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 280 H170 V240 H300 V280 H560 V240 H690 V280 H768"
        fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linejoin="round"/>

  <text x="235" y="306" fill="#86efac" font-size="12" text-anchor="middle">passes</text>
  <text x="326" y="306" fill="#fca5a5" font-size="12" text-anchor="middle" font-weight="600">blocked</text>
  <text x="625" y="306" fill="#86efac" font-size="12" text-anchor="middle">passes</text>
</svg>
